name: Test Demo 1

on:
  pull_request:
    paths:
      - 'demo1/**'
      - '.github/**'
    branches: [ main ]

  workflow_dispatch: {}

jobs:
  check-if-test1-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.watched_paths.outputs.src }}
    steps:
      - id: watched_paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            src:
            - demo1/**
            - build.gradle.kts
            - settings.gradle.kts
            - gradle/**
      - name: write build should run in env
        run: |
          echo ${{ steps.watched_paths.outputs.src }}
  test-demo-1:
    needs: check-if-test1-should-run
    if: ${{ needs.check-if-test1-should-run.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./demo1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          distribution: 'liberica'
          java-version: '21'
      - run: ./gradlew clean build
